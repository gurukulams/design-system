name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create the release
  packages: read    # @gurukulams/practice-js from GitHub Packages

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm run build

      - name: Package theme
        run: |
          echo "$GITHUB_REF_NAME" > VERSION
          mkdir dist
          tar -czf dist/design-system.tar.gz \
            layouts assets i18n static archetypes \
            theme.toml hugo.toml go.mod LICENSE VERSION

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flags=""
          [[ "$GITHUB_REF_NAME" == *-* ]] && flags="--prerelease"
          gh release create "$GITHUB_REF_NAME" dist/design-system.tar.gz \
            --generate-notes $flags