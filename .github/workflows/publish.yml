
name: Build, Release and Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  NODE_VERSION: '22.x'

permissions:
  contents: read
  packages: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build Hugo Module
    runs-on: ubuntu-latest

    strategy:
      matrix:
        hugo-version:
          - '0.153.0'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ matrix.hugo-version }}
          extended: true

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build Website and Questions
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export PUBLIC_FOLDER="$PWD/exampleSite/public"

          npm ci
          npm run build --if-present

          cd exampleSite

          export HUGO_PARAMS_LOGINMODE=""
          export HUGO_PARAMS_QUESTIONREPOSITORY="https://designsystem.gurukulams.com/"

          hugo \
            --themesDir ../.. \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

          cd ..

          npm run build --if-present

          git clone https://github.com/gurukulams/practice-js.git

          cd practice-js
          npm i
          npm run build:questions

      # Upload the complete post-build working directory
      - name: Upload Complete Build Directory
        uses: actions/upload-artifact@v4
        with:
          name: build-bundle
          path: |
            .
            !.git
            !node_modules
            !practice-js/.git
            !practice-js/node_modules
          include-hidden-files: true
          retention-days: 1

      # Upload Hugo public folder for GitHub Pages
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./exampleSite/public

  # Create and publish latest release
  release:
    name: Publish Latest Release
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: write
      actions: read

    steps:
      - name: Download Complete Build Directory
        uses: actions/download-artifact@v4
        with:
          name: build-bundle
          path: ./build

      - name: Create Complete Build ZIP
        run: |
          cd build
          zip -r "$GITHUB_WORKSPACE/site-build.zip" . \
            -x "node_modules/*" \
            -x "practice-js/node_modules/*"

      - name: Delete Previous Latest Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true

      - name: Publish Latest Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create latest \
            "$GITHUB_WORKSPACE/site-build.zip" \
            --title "Latest Build" \
            --notes "Automated Hugo Module build.

          Complete post-build working directory.

          Commit: $GITHUB_SHA" \
            --target "$GITHUB_SHA" \
            --latest

  # Deploy to GitHub Pages
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
