# Sample workflow for building and deploying a Hugo site to GitHub Pages
name: Deploy Questions

on:
  workflow_call:  # <--- THIS IS THE MISSING PART
  # You can still keep your other triggers too
  # push:
  #   branches: ["main"]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages,
# plus read access to GitHub Packages for the theme's @gurukulams dependencies
permissions:
  contents: read
  packages: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    
    - name: Prepare
      run: |
        git clone https://github.com/gurukulams/practice-js.git

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: 'practice-js/package-lock.json'

    - name: Build
      run: |
        export QUESTIONS_FOLDER="$PWD/questions"
        cd practice-js
        npm i
        npm run build:questions

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: practice-js/dist

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
