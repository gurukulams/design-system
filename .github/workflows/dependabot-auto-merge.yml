name: Dependabot Auto-merge

# Closes the release loop: practice-js publishes a new version -> Dependabot opens
# a bump PR -> CI validates it -> this enables auto-merge -> push to main triggers
# the Pages deploy. No human step for patch/minor first-party bumps.
#
# Only @gurukulams/* patch and minor updates auto-merge. Majors, and every
# third-party dependency, still wait for a human.
#
# Requires "Allow auto-merge" enabled in Settings -> General, and a branch
# protection rule on main requiring the CI workflow. Without a required check,
# --auto merges as soon as it is set and the gate is bypassed.

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
    - name: Fetch Dependabot metadata
      id: metadata
      uses: dependabot/fetch-metadata@v2
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Enable auto-merge for first-party patch/minor bumps
      if: |
        contains(steps.metadata.outputs.dependency-names, '@gurukulams/') &&
        (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
         steps.metadata.outputs.update-type == 'version-update:semver-minor')
      run: gh pr merge --auto --squash "$PR_URL"
      env:
        PR_URL: ${{ github.event.pull_request.html_url }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
